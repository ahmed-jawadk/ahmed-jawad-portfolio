    />

    <!-- Runs before paint: marks JS as available (enables reveal states) and restores the saved theme. -->
    <script>
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') d.dataset.theme = t
        } catch (e) {}
      })()
    </script>
